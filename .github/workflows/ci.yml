name: CI

# No push trigger: on main, CI runs inside build-and-deploy.yml, so it still runs once per commit.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config -q

      # No "docker compose pull" check: the image is built from this repo, so CI builds it instead.
      # Pulling :latest would only test the last published image, and fails before the first deploy.

      - name: Build the image
        run: docker build -t vnas-discord-bot:ci .

      # No Discord token on the runner, so this checks the image without logging in.
      - name: Image loads the bot
        run: |
          docker run --rm --entrypoint node vnas-discord-bot:ci -e "
            require('./src/feed'); require('./src/status'); require('./src/embeds'); require('./src/notify'); require('./src/ironmicCommand'); require('discord.js');
            const { parseClosing } = require('./src/status');
            const at = parseClosing('Online until 8pm ET', new Date('2026-12-01T22:00:00Z')).at;
            if (at.toISOString() !== '2026-12-02T01:00:00.000Z') throw new Error('Time zone data missing: ' + at.toISOString());
            console.log('ok');
          "

  # The send Worker in worker/ (Cloudflare, deployed by build-and-deploy.yml's deploy-worker job).
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Builds the published @indy-center/indy-larry-worker types and lists what npm would publish, so a broken
      # client package fails here rather than at npm publish.
      - name: Client package
        run: npm run build:lib && npm pack --dry-run

      # Bundles the Worker without uploading it, so a bad wrangler.jsonc or import fails here, not at deploy.
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist-check
