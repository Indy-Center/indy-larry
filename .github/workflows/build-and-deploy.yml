name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The send Worker in worker/: other Workers' service bindings call it to send Discord messages as Larry.
  # Needs the CLOUDFLARE_WORKERS_API_KEY repo secret (Workers Scripts:Edit, Queues:Edit) and the
  # larry-messages and larry-messages-dlq queues (README, Sending messages from other apps).
  deploy-worker:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
      SEND_CHANNELS: ${{ secrets.ENV_SEND_CHANNELS || vars.ENV_SEND_CHANNELS }}
      CHANNEL_ID: ${{ secrets.ENV_CHANNEL_ID || vars.ENV_CHANNEL_ID }}
      # Roles and channels (README, Roles and channels). Left unset, those methods refuse every call.
      GUILD_ID: ${{ vars.ENV_GUILD_ID }}
      CHANNEL_CATEGORIES: ${{ vars.ENV_CHANNEL_CATEGORIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # Fails on a malformed entry, a repeated name or the status channel, before anything is deployed.
      - name: Check SEND_CHANNELS
        run: node scripts/check-channels.ts

      # SEND_CHANNELS goes in as a plain var, quoted by the shell rather than pasted into a command.
      - name: Deploy
        run: >-
          npx wrangler deploy
          --var "SEND_CHANNELS:$SEND_CHANNELS"
          --var "GUILD_ID:$GUILD_ID"
          --var "CHANNEL_CATEGORIES:$CHANNEL_CATEGORIES"

      # Same token as the VPS bot, so messages come from Larry. Re-set on every deploy to stay in step with it.
      - name: Set DISCORD_TOKEN
        env:
          DISCORD_TOKEN: ${{ secrets.ENV_DISCORD_TOKEN }}
        run: printf '%s' "$DISCORD_TOKEN" | npx wrangler secret put DISCORD_TOKEN

  build-and-deploy:
    needs: ci # skipped if any check fails
    runs-on: ubuntu-latest
    env:
      # The app's directory on the VPS: /home/deploy/apps/<repo name>/.
      APP: ${{ github.event.repository.name }}
      IMAGE: ghcr.io/indy-center/vnas-discord-bot
    steps:
      - uses: actions/checkout@v4

      - name: Build and push the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The source label links the package to this repository, so it inherits the repo's access.
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push --all-tags "$IMAGE"

      # VANDERBILT_HOST and VANDERBILT_DEPLOY_USER are organization variables, the key and known_hosts are organization
      # secrets; all four are limited to selected repositories.
      # An org admin adds this repository to each of them before the first deploy.
      - name: Set up SSH
        env:
          VANDERBILT_HOST: ${{ vars.VANDERBILT_HOST }}
          VANDERBILT_DEPLOY_USER: ${{ vars.VANDERBILT_DEPLOY_USER }}
          VANDERBILT_DEPLOY_SSH_KEY: ${{ secrets.VANDERBILT_DEPLOY_SSH_KEY }}
          VANDERBILT_KNOWN_HOSTS: ${{ secrets.VANDERBILT_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VANDERBILT_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VANDERBILT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VANDERBILT_HOST
            User $VANDERBILT_DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # --delete removes files dropped from deploy/; excluded files (.env) are never deleted.
      - name: Sync deploy/ to ~/apps/<app>/
        run: rsync -rlz --delete --exclude=.env --exclude=.env.example deploy/ "vps:apps/$APP/"

      # Writes ~/apps/<app>/.env from the ENV_* settings listed below: ENV_<NAME> becomes NAME='value'.
      # The deploy owns that file and rewrites it every time, so a value changes by updating its secret
      # or variable and re-running the deploy, never by editing the file on the box.
      - name: Write .env
        env:
          # One line per setting in deploy/.env.example. Listed by name rather than passing
          # toJSON(secrets): the step only sees what the bot needs, and GitHub flags workflows that
          # hand every secret to a step that talks to another host. Each setting can be a repo secret
          # or a repo variable (the secret wins if both exist); the token is only read as a secret.
          ENV_DISCORD_TOKEN: ${{ secrets.ENV_DISCORD_TOKEN }}
          ENV_CHANNEL_ID: ${{ secrets.ENV_CHANNEL_ID || vars.ENV_CHANNEL_ID }}
          ENV_ARTCC_IDS: ${{ secrets.ENV_ARTCC_IDS || vars.ENV_ARTCC_IDS }}
          ENV_POLL_SECONDS: ${{ secrets.ENV_POLL_SECONDS || vars.ENV_POLL_SECONDS }}
          ENV_INCLUDE_INACTIVE: ${{ secrets.ENV_INCLUDE_INACTIVE || vars.ENV_INCLUDE_INACTIVE }}
          ENV_SHOW_NAMES: ${{ secrets.ENV_SHOW_NAMES || vars.ENV_SHOW_NAMES }}
          ENV_PLANNED_HOURS: ${{ secrets.ENV_PLANNED_HOURS || vars.ENV_PLANNED_HOURS }}
          ENV_CLOSING_MINUTES: ${{ secrets.ENV_CLOSING_MINUTES || vars.ENV_CLOSING_MINUTES }}
          ENV_OFFLINE_MINUTES: ${{ secrets.ENV_OFFLINE_MINUTES || vars.ENV_OFFLINE_MINUTES }}
          ENV_PANEL_CHANNEL_ID: ${{ secrets.ENV_PANEL_CHANNEL_ID || vars.ENV_PANEL_CHANNEL_ID }}
          ENV_ALERT_CHANNEL_ID: ${{ secrets.ENV_ALERT_CHANNEL_ID || vars.ENV_ALERT_CHANNEL_ID }}
          ENV_RELIEF_ROLES: ${{ secrets.ENV_RELIEF_ROLES || vars.ENV_RELIEF_ROLES }}
          ENV_CAB_ROLES: ${{ secrets.ENV_CAB_ROLES || vars.ENV_CAB_ROLES }}
          ENV_TRACON_ROLES: ${{ secrets.ENV_TRACON_ROLES || vars.ENV_TRACON_ROLES }}
          ENV_ENROUTE_ROLES: ${{ secrets.ENV_ENROUTE_ROLES || vars.ENV_ENROUTE_ROLES }}
          ENV_REQUEST_EXPIRE_MINUTES: ${{ secrets.ENV_REQUEST_EXPIRE_MINUTES || vars.ENV_REQUEST_EXPIRE_MINUTES }}
          ENV_IRON_MIC_ROLE_ID: ${{ secrets.ENV_IRON_MIC_ROLE_ID || vars.ENV_IRON_MIC_ROLE_ID }}
          ENV_IRON_MIC_CHANNEL_ID: ${{ secrets.ENV_IRON_MIC_CHANNEL_ID || vars.ENV_IRON_MIC_CHANNEL_ID }}
          ENV_SEND_CHANNELS: ${{ secrets.ENV_SEND_CHANNELS || vars.ENV_SEND_CHANNELS }}
        run: |
          # Values are single-quoted so Compose takes them literally, $ and # included. So a value can't
          # contain a single quote or a newline; if one does, this fails before anything reaches the box.
          # Unset settings arrive empty and are left out, so the bot's own defaults apply.
          filter=$(cat <<'JQ'
          env | to_entries | sort_by(.key)[]
          | select(.key | startswith("ENV_"))
          | select(.value != "")
          | if (.value | test("['\n]"))
            then error("\(.key) contains a single quote or a newline")
            else "\(.key | ltrimstr("ENV_"))='\(.value)'"
            end
          JQ
          )
          env_file="$(jq -rn "$filter")"
          printf '%s\n' "$env_file" | ssh vps "umask 077 && cat > apps/$APP/.env"

      # The ghcr.io package is public, so the VPS pulls without logging in.
      - name: docker compose up -d
        run: |
          ssh vps "APP=$APP bash -s" <<'EOF'
          set -e
          cd ~/apps/"$APP"
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          sleep 15
          docker compose ps
          # Healthy = nothing restarting and no restarts since start. One-shot containers that exited 0 pass.
          if docker inspect -f '{{.State.Restarting}} {{.RestartCount}}' $(docker compose ps -aq) | grep -qv '^false 0$'; then
            docker compose logs --tail 50
            exit 1
          fi
          # Startup lines only (the run log is public): login, adopted messages, /ironmic and anything that failed.
          docker compose logs --no-log-prefix | grep -iE 'logged in|adopted|polling|ironmic|iron mic|failed|error' | tail -n 30 || true
          EOF
