name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci # skipped if any check fails
    runs-on: ubuntu-latest
    env:
      # The app's directory on the VPS: /home/deploy/apps/<repo name>/.
      APP: ${{ github.event.repository.name }}
      IMAGE: ghcr.io/indy-center/vnas-discord-bot
    steps:
      - uses: actions/checkout@v4

      - name: Build and push the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The source label links the package to this repository, so it inherits the repo's access.
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push --all-tags "$IMAGE"

      # The VANDERBILT_* secrets are organization secrets limited to selected repositories.
      # An org admin adds this repository to all four before the first deploy.
      - name: Set up SSH
        env:
          VANDERBILT_HOST: ${{ secrets.VANDERBILT_HOST }}
          VANDERBILT_DEPLOY_USER: ${{ secrets.VANDERBILT_DEPLOY_USER }}
          VANDERBILT_DEPLOY_SSH_KEY: ${{ secrets.VANDERBILT_DEPLOY_SSH_KEY }}
          VANDERBILT_KNOWN_HOSTS: ${{ secrets.VANDERBILT_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VANDERBILT_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VANDERBILT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VANDERBILT_HOST
            User $VANDERBILT_DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # Runtime settings live in the DOTENV repository secret (the whole .env file). Written over stdin,
      # so the token never appears on a command line or in the log, and readable only by deploy.
      - name: Write .env on the VPS
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::The DOTENV repository secret is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # tr drops Windows line endings, which would otherwise end up inside the values.
          printf '%s\n' "$DOTENV" | tr -d '\r' | ssh vps "umask 077 && mkdir -p ~/apps/$APP && cat > ~/apps/$APP/.env"

      # --delete removes files dropped from deploy/; excluded files (.env) are never deleted.
      - name: Sync deploy/ to ~/apps/<app>/
        run: rsync -rlz --delete --exclude=.env deploy/ "vps:apps/$APP/"

      # The ghcr.io package is public, so the VPS pulls without logging in.
      - name: docker compose up -d
        run: |
          ssh vps "APP=$APP bash -s" <<'EOF'
          set -e
          cd ~/apps/"$APP"
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          sleep 15
          docker compose ps
          # Healthy = nothing restarting and no restarts since start. One-shot containers that exited 0 pass.
          if docker inspect -f '{{.State.Restarting}} {{.RestartCount}}' $(docker compose ps -aq) | grep -qv '^false 0$'; then
            docker compose logs --tail 50
            exit 1
          fi
          EOF
