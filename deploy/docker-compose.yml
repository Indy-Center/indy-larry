# The bot's deploy/docker-compose.yml. build-and-deploy.yml rsyncs deploy/ to
# /home/deploy/apps/indy-larry/ on the Vanderbilt VPS, so the compose project is named after the repo.
# Renaming the repo renames the project and its volumes; the old container keeps running and its volumes stay behind,
# so `docker compose down` the old project on the VPS (see README, Deployment).
# The bot only makes outbound calls (Discord, vNAS, VATSIM), so it has no Traefik labels,
# doesn't join traefik-shared and publishes no ports.
services:
  bot:
    # Built and pushed by build-and-deploy.yml.
    image: ghcr.io/indy-center/vnas-discord-bot:latest
    restart: unless-stopped
    init: true # forwards stop signals so the container shuts down promptly
    # .env is written on the VPS by the deploy from the repo's ENV_* secrets and variables; it's never in git.
    # deploy/.env.example lists the names.
    env_file:
      - path: .env
        required: false
    volumes:
      # Named volume: the deploy rsyncs with --delete, so state.json can't live under deploy/.
      - bot-state:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  bot-state:
